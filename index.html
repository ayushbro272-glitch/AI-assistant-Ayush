<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0072ff">
<title>AI assistant Ayush</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#0f2027;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:12px;background:#0072ff;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:1.1em}
.btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:1em;cursor:pointer}
.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:14px;line-height:1.6;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#0072ff;color:#fff}
.msg.bot{align-self:flex-start;background:#fff;color:#000;border-left:4px solid #00c6ff}
.msg.err{background:#ffe8e8;color:#8b0000;border-left-color:#e74c3c}
.msg img,.msg video{max-width:100%;border-radius:8px;margin-top:8px}
.msg pre{background:#f0f0f0;color:#000;padding:8px;border-radius:6px;overflow-x:auto;font-size:.85em}
.msg audio{width:100%;margin-top:6px}
.input-area{padding:10px;background:#000;display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;padding:10px;background:#1a1a2e;border:1px solid #0072ff;border-radius:18px;color:#fff;font-family:inherit;font-size:1em;resize:none;min-height:44px;max-height:100px}
.mic,.send,.screen,.file{width:44px;height:44px;border:none;border-radius:50%;font-size:1.1em;cursor:pointer;color:#fff;flex-shrink:0}
.file{background:#333}
.screen{background:#333}
.screen.on{background:#27ae60}
.mic{background:#333}
.mic.rec{background:#e74c3c}
.send{background:#0072ff}
.loading{padding:8px;color:#aaa;font-size:.9em}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;padding:20px;overflow-y:auto}
.modal.open{display:block}
.modal-box{max-width:450px;margin:30px auto;background:#1a1a2e;padding:22px;border-radius:12px}
.modal-box h2{color:#00c6ff;margin-bottom:14px}
.modal-box label{display:block;color:#00c6ff;margin:12px 0 4px;font-size:.9em}
.modal-box input{width:100%;padding:10px;background:#000;border:1px solid #444;border-radius:6px;color:#fff}
.modal-box .hint{font-size:.75em;color:#888;margin-top:3px}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.save{background:#0072ff;color:#fff}
.cancel{background:#333;color:#fff}
</style>
</head>
<body>

<div class="header">
<h1>⚡ AI assistant Ayush</h1>
<div>
<button class="btn" onclick="toggleSpeak()" id="spkBtn">🔇</button>
<button class="btn" onclick="openSettings()">⚙️</button>
</div>
</div>

<div class="messages" id="messages">
<div class="msg bot">
नमस्ते! मैं <b>कोडिंग लवर</b> हूँ 💻<br>
मुझे <b>मिस्टर आयुष राज</b> ने बनाया है।<br><br>
बात करो, तस्वीर बनवाओ, वीडियो बनवाओ, संगीत सुनो — सब कुछ।<br><br>
पहले ⚙️ में चाबियाँ डालो, फिर पूछो।
</div>
</div>

<div class="input-area">
<input type="file" id="fileInput" style="display:none" accept="image/*" onchange="onFile(event)">
<button class="file" onclick="document.getElementById('fileInput').click()">📎</button>
<button class="screen" id="screenBtn" onclick="toggleScreen()">📱</button>
<textarea id="input" placeholder="कुछ भी पूछो..." rows="1"></textarea>
<button class="mic" id="micBtn" onclick="toggleMic()">🎤</button>
<button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<div class="modal" id="settings">
<div class="modal-box">
<h2>⚙️ चाबियाँ डालो</h2>

<label>🔍 जेमिनी चाबी (मुख्य दिमाग़)</label>
<input id="geminiKey" placeholder="AIza... या AQ...">
<div class="hint">aistudio.google.com/apikey — मुफ़्त</div>

<label>⚡ ग्रोक चाबी (बैकअप)</label>
<input id="groqKey" placeholder="gsk_...">
<div class="hint">console.groq.com/keys — मुफ़्त</div>

<label>🎨 Agnes चाबी (तस्वीर बनाना)</label>
<input id="agnesKey" placeholder="sk-...">
<div class="hint">platform.agnes-ai.com — मुफ़्त</div>

<div class="modal-btns">
<button class="cancel" onclick="closeSettings()">रद्द</button>
<button class="save" onclick="saveSettings()">सहेजो</button>
</div>
</div>
</div>

<script>
var MSG = document.getElementById('messages');
var currentLang = "hi-IN";
var autoSpeak = false;
var recording = false;
var recognition = null;
var attachedFile = null;
var screenStream = null;
var screenShotData = null;
var lastImage = null;

var CAP = "तुम 'कोडिंग लवर' हो — पूरा AI सहायक। तुम्हें मिस्टर आयुष राज ने बहुत जटिल कोडिंग करके बनाया है। कोई पूछे 'किसने बनाया' तो कहो: 'मुझे मिस्टर आयुष राज ने बनाया है।' तुम्हारे पास है: तस्वीर बनाना, वीडियो बनाना, संगीत, कोड, स्क्रीन शेयर, फ़ाइल पढ़ना, इंटरनेट खोज। हिंदी में जवाब दो। 'नहीं/मत' = इनकार (कुछ मत बनाओ)। 'क्यों/क्या/कैसे' = सवाल (जवाब दो)। 'बनाओ/लिखो' = हुक्म (तब बनाओ)। समझ न आए तो कहो: 'माफ़ करना, समझ नहीं पाया। फिर से बताओ।'";

// ============ चाबियाँ ============
function getKeys() {
    try { return JSON.parse(localStorage.getItem("ai_ayush_keys") || '{}'); }
    catch(e) { return {}; }
}
function openSettings() {
    var k = getKeys();
    document.getElementById('geminiKey').value = k.gemini || "";
    document.getElementById('groqKey').value = k.groq || "";
    document.getElementById('agnesKey').value = k.agnes || "";
    document.getElementById('settings').classList.add('open');
}
function closeSettings() { document.getElementById('settings').classList.remove('open'); }
function saveSettings() {
    var k = {
        gemini: document.getElementById('geminiKey').value.trim(),
        groq: document.getElementById('groqKey').value.trim(),
        agnes: document.getElementById('agnesKey').value.trim()
    };
    localStorage.setItem("ai_ayush_keys", JSON.stringify(k));
    closeSettings();
    addMsg('bot', '✅ चाबियाँ सहेज लीं!');
}

// ============ संदेश ============
function addMsg(type, content) {
    var d = document.createElement('div');
    d.className = 'msg ' + type;
    d.innerHTML = content;
    MSG.appendChild(d);
    MSG.scrollTop = MSG.scrollHeight;
    return d;
}
function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatReply(text) {
    var s = escapeHtml(text);
    s = s.replace(/```(\w+)?\n?([\s\S]*?)```/g, '<pre>$2</pre>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\n/g, '<br>');
    return s;
}

// ============ बोलना ============
function toggleSpeak() {
    autoSpeak = !autoSpeak;
    document.getElementById('spkBtn').textContent = autoSpeak ? '🔊' : '🔇';
}
function speak(text) {
    if (!window.speechSynthesis || !autoSpeak) return;
    var clean = text.replace(/<[^>]+>/g, '').replace(/\n/g, '। ');
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = currentLang;
    speechSynthesis.speak(u);
}

// ============ माइक ============
function toggleMic() {
    if (recording) { try { recognition.stop(); } catch(e) {} return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('तुम्हारे फ़ोन में आवाज़ पहचान नहीं है। Chrome ब्राउज़र में खोलो।'); return; }
    recognition = new SR();
    recognition.lang = currentLang;
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = function() {
        recording = true;
        var m = document.getElementById('micBtn');
        m.classList.add('rec');
        m.textContent = '⏹';
    };
    recognition.onresult = function(e) {
        var text = '';
        for (var i = e.resultIndex; i < e.results.length; i++) {
            text += e.results[i][0].transcript;
        }
        document.getElementById('input').value = text;
    };
    recognition.onerror = function(ev) {
        alert('माइक की अनुमति नहीं मिली: ' + ev.error + '\n\nफ़ोन Settings → Apps → ऐप → Permissions → Microphone चालू करो।');
    };
    recognition.onend = async function() {
        recording = false;
        var m = document.getElementById('micBtn');
        m.classList.remove('rec');
        m.textContent = '🎤';
        if (screenStream) {
            screenShotData = await captureScreen();
        }
        var txt = document.getElementById('input').value.trim();
        if (txt) setTimeout(sendMessage, 300);
    };
    try { recognition.start(); } catch(e) { alert('माइक शुरू नहीं हुआ: ' + e.message); }
}

// ============ स्क्रीन शेयर ============
async function toggleScreen() {
    if (screenStream) {
        try { screenStream.getTracks().forEach(t => t.stop()); } catch(e) {}
        screenStream = null;
        document.getElementById('screenBtn').classList.remove('on');
        addMsg('bot', '📱 स्क्रीन शेयर बंद।');
        return;
    }
    try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        document.getElementById('screenBtn').classList.add('on');
        screenStream.getVideoTracks()[0].addEventListener('ended', function() {
            screenStream = null;
            document.getElementById('screenBtn').classList.remove('on');
        });
        addMsg('bot', '📱 स्क्रीन शेयर चालू! अब 🎤 दबाकर बोलो — उस वक़्त की स्क्रीन AI को जाएगी।');
    } catch(e) {
        alert('स्क्रीन शेयर नहीं हो पाई: ' + e.message);
    }
}
async function captureScreen() {
    try {
        var video = document.createElement('video');
        video.srcObject = screenStream;
        video.muted = true;
        await video.play();
        await new Promise(r => setTimeout(r, 300));
        var c = document.createElement('canvas');
        c.width = video.videoWidth || 1080;
        c.height = video.videoHeight || 1920;
        c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
        video.pause();
        return c.toDataURL('image/jpeg', 0.7).split(',')[1];
    } catch(e) { return null; }
}

// ============ फ़ाइल ============
function onFile(e) {
    var f = e.target.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { alert('फ़ाइल 20MB से बड़ी।'); return; }
    attachedFile = f;
    addMsg('bot', '📎 फ़ाइल मिली: <b>' + escapeHtml(f.name) + '</b><br>अब बताओ क्या करना है।');
}

// ============ API ============
async function callGemini(text, img) {
    var k = getKeys();
    if (!k.gemini) throw new Error('जेमिनी चाबी नहीं है। ⚙️ में डालो।');
    var models = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'];
    var parts = [{ text: text }];
    if (img) parts.push({ inline_data: { mime_type: 'image/jpeg', data: img } });
    var lastErr = '';
    for (var i = 0; i < models.length; i++) {
        try {
            var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + models[i] + ':generateContent?key=' + k.gemini;
            var r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: parts }] })
            });
            if (r.ok) {
                var d = await r.json();
                return d.candidates[0].content.parts[0].text;
            }
            lastErr = models[i] + ':' + r.status;
        } catch(e) { lastErr = e.message; }
    }
    throw new Error('जेमिनी विफल — ' + lastErr);
}

async function callGroq(text, sys) {
    var k = getKeys();
    if (!k.groq || k.groq.indexOf('gsk_') !== 0) throw new Error('ग्रोक चाबी सही नहीं।');
    var r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + k.groq },
        body: JSON.stringify({
            model: 'groq/compound',
            messages: [{ role: 'system', content: sys }, { role: 'user', content: text }],
            temperature: 0.3, max_tokens: 4000
        })
    });
    if (!r.ok) throw new Error('ग्रोक ' + r.status);
    var d = await r.json();
    return d.choices[0].message.content;
}

async function callAgnesImage(prompt) {
    var k = getKeys();
    if (!k.agnes || k.agnes.indexOf('sk-') !== 0) throw new Error('Agnes चाबी नहीं है। ⚙️ में डालो।');
    var r = await fetch('https://apihub.agnes-ai.com/v1/images/generations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + k.agnes },
        body: JSON.stringify({
            model: 'agnes-image-2.5-flash',
            prompt: prompt + ', ultra detailed, 8k, professional photography, sharp focus',
            size: '2K', ratio: '1:1',
            extra_body: { response_format: 'url' }
        })
    });
    if (!r.ok) { var eb = await r.text(); throw new Error('Agnes ' + r.status + ': ' + eb.substring(0,150)); }
    var d = await r.json();
    var url = d.data && d.data[0] && d.data[0].url;
    if (!url) throw new Error('तस्वीर URL नहीं मिला');
    lastImage = url;
    return url;
}

async function callAgnesEdit(base64Full, editPrompt) {
    var k = getKeys();
    if (!k.agnes) throw new Error('Agnes चाबी नहीं।');
    var fullPrompt = 'Edit: ' + editPrompt + '. Keep EXACT SAME face, eyes, nose, skin, hair. DO NOT change the face. ONLY change what was asked.';
    var r = await fetch('https://apihub.agnes-ai.com/v1/images/generations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + k.agnes },
        body: JSON.stringify({
            model: 'agnes-image-2.5-flash',
            prompt: fullPrompt,
            size: '2K', ratio: '1:1',
            extra_body: { image: [base64Full], response_format: 'url' }
        })
    });
    if (!r.ok) throw new Error('Agnes एडिट ' + r.status);
    var d = await r.json();
    var url = d.data && d.data[0] && d.data[0].url;
    if (!url) throw new Error('एडिट URL नहीं मिला');
    return url;
}

async function callVeo(text) {
    if (typeof puter === 'undefined' || !puter.ai) throw new Error('Puter.js लोड नहीं हुआ।');
    var v = await puter.ai.txt2vid(text, { model: 'google/veo-3.1' });
    var url = '';
    if (typeof v === 'string') url = v;
    else if (v && v.src) url = v.src;
    else if (v && v.querySelector) { var s = v.querySelector('source'); if (s) url = s.src; }
    if (!url) throw new Error('वीडियो URL नहीं मिला');
    return url;
}

function playMusic(prompt) {
    try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var t = prompt.toLowerCase();
        var wave = 'triangle', dur = 0.8, label = 'पियानो';
        if (/guitar|गिटार/.test(t)) { wave='sawtooth'; dur=0.6; label='गिटार'; }
        else if (/flute|बांसुरी/.test(t)) { wave='sine'; dur=0.5; label='बांसुरी'; }
        else if (/violin|वायलिन/.test(t)) { wave='sawtooth'; dur=0.7; label='वायलिन'; }
        else if (/drum|ढोल|तबला/.test(t)) { wave='square'; dur=0.15; label='ढोल'; }
        var C=261.63,D=293.66,E=329.63,F=349.23,G=392,A=440,B=493.88;
        var scale = [C,D,E,F,G,A,B,523.25], tempo = 0.4;
        if (/sad|दुखी/.test(t)) tempo = 0.55;
        else if (/happy|खुश/.test(t)) tempo = 0.32;
        else if (/fast|तेज़/.test(t)) tempo = 0.2;
        var idx = 2, start = ctx.currentTime + 0.1;
        for (var i = 0; i < 20; i++) {
            idx = Math.max(0, Math.min(scale.length-1, idx + Math.floor(Math.random()*5)-2));
            var o = ctx.createOscillator(), g = ctx.createGain();
            o.type = wave;
            o.frequency.value = scale[idx];
            var s = start + i*tempo;
            g.gain.setValueAtTime(0, s);
            g.gain.linearRampToValueAtTime(0.15, s + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, s + dur + 0.5);
            o.connect(g); g.connect(ctx.destination);
            o.start(s); o.stop(s + dur + 0.6);
        }
        setTimeout(() => { try { ctx.close(); } catch(e) {} }, 20000);
        return '🎵 ' + label + ' का संगीत बज रहा है!';
    } catch(e) { return '❌ संगीत विफल: ' + e.message; }
}

// ============ भेजना ============
async function sendMessage() {
    var inp = document.getElementById('input');
    var text = inp.value.trim();
    var shot = screenShotData;
    screenShotData = null;

    if (!text && !attachedFile && !shot) return;

    inp.value = '';
    inp.style.height = 'auto';

    var userShow = escapeHtml(text);
    if (attachedFile) userShow = '🖼️ ' + escapeHtml(attachedFile.name) + (text ? '<br>' + escapeHtml(text) : '');
    if (shot) userShow = '📱 [स्क्रीनशॉट]' + (text ? '<br>' + escapeHtml(text) : '');
    addMsg('user', userShow);

    var load = addMsg('bot', '<div class="loading">⏳ सोच रहा हूँ...</div>');
    var btn = document.getElementById('sendBtn');
    btn.disabled = true;

    var fileToProcess = attachedFile;
    attachedFile = null;

    try {
        var reply = '';

        // स्क्रीनशॉट → विज़न
        if (shot) {
            load.innerHTML = '<div class="loading">👁️ स्क्रीन देख रहा हूँ...</div>';
            reply = formatReply(await callGemini(text || 'इस स्क्रीन में क्या है? हिंदी में बताओ।', shot));
        }
        // फ़ोटो एडिट
        else if (fileToProcess && /(edit|एडिट|बदलो|badlo|रंग|color|shirt|कमीज़|baal|बाल|चश्मा|pila|पीला|laal|लाल|neela|नीला)/i.test(text) && !/नहीं|मत|nahi|mat/.test(text)) {
            load.innerHTML = '<div class="loading">✏️ फ़ोटो एडिट हो रही है...</div>';
            var b64 = await new Promise(r => { var fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(fileToProcess); });
            var editUrl = await callAgnesEdit(b64, text);
            reply = '<img src="' + editUrl + '" alt=""><br>✏️ चेहरा वही, बदलाव सिर्फ़ जो कहा';
        }
        // वीडियो
        else if (/(video|वीडियो)/i.test(text) && /(banao|बनाओ|create|make|generate)/i.test(text) && !/नहीं|मत|nahi|mat/.test(text)) {
            load.innerHTML = '<div class="loading">🎬 Veo 3.1 से वीडियो बन रहा है... 30-60 सेकंड</div>';
            var vurl = await callVeo(text);
            reply = '<video controls autoplay loop src="' + vurl + '"></video><br>✅ Veo 3.1 से बना';
        }
        // तस्वीर बनाना
        else if (/(tasveer|तस्वीर|photo|फोटो|image|चित्र)/i.test(text) && /(banao|बनाओ|create|make|generate|draw)/i.test(text) && !/नहीं|मत|nahi|mat|video|वीडियो/.test(text)) {
            load.innerHTML = '<div class="loading">🎨 Agnes से तस्वीर बन रही है...</div>';
            var iurl = await callAgnesImage(text);
            reply = '<img src="' + iurl + '" alt=""><br>🎨 Agnes Image 2.5 (2K)';
        }
        // संगीत
        else if (/(music|संगीत|गाना|gaan|song|धुन|melody|bajao|बजाओ|suna|सुना)/i.test(text)) {
            load.innerHTML = '<div class="loading">🎵 संगीत...</div>';
            reply = playMusic(text);
        }
        // फ़ोटो भेजी है — देखो और बताओ
        else if (fileToProcess && fileToProcess.type.startsWith('image/')) {
            load.innerHTML = '<div class="loading">👁️ फ़ोटो देख रहा हूँ...</div>';
            var fb = await new Promise(r => { var fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(fileToProcess); });
            reply = formatReply(await callGemini(text || 'इस फ़ोटो में क्या है? हिंदी में बताओ।', fb));
        }
        // सामान्य बातचीत
        else {
            load.innerHTML = '<div class="loading">💬 सोच रहा हूँ...</div>';
            try {
                reply = await callGemini(CAP + '\n\nउपयोगकर्ता: ' + text);
            } catch(e1) {
                reply = await callGroq(text, CAP);
            }
            reply = formatReply(reply);
        }

        load.remove();
        addMsg('bot', reply);
        speak(reply.replace(/<[^>]+>/g, ''));

    } catch(e) {
        load.remove();
        addMsg('err', '❌ ' + escapeHtml(e.message) + '<br><br>कृपया फिर से ट्राई करें।');
    } finally {
        btn.disabled = false;
    }
}

// ============ इनपुट ============
var inp = document.getElementById('input');
inp.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// शुरुआत में चाबी जाँच
if (!getKeys().gemini) setTimeout(openSettings, 800);
</script>
